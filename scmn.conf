# ==============================================================================
# scmn Configuration File
# ==============================================================================
# Format:
# shortname | directory | command | logfile | env | auto_restart
#
# Rules:
# - Lines starting with '#' are ignored.
# - 'directory': Working directory (use '-' or leave empty for current dir).
# - 'logfile': Logfile path (use 'none' or '-' for no logging).
# - 'env': Environment variables (e.g. 'PORT=8080 NODE_ENV=prod' or '-').
# - 'auto_restart': Restart policy:
#     - 'always' (or 'true'): Always restart in loop regardless of exit code.
#     - 'on-failure' (or 'fail'): Restart only if process exits with non-zero code.
#     - 'false' (or 'no'): No automatic loop (exit when command finishes).
# ==============================================================================

# Service 1: Ping background process with 'always' auto_restart
dummy_ping | - | ping -i 2 127.0.0.1 | none | - | always

# Service 2: Python HTTP Server with 'on-failure' auto_restart and environment variable
dummy_server | /tmp | python3 -m http.server $PORT | /tmp/dummy_server.log | PORT=9999 | on-failure
